name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      RAG_SKIP_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-grounded-lock.txt
          python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
